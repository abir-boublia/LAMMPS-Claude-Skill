<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 510" role="img" aria-labelledby="title desc">
  <title id="title">LAMMPS Expert Skill for Claude</title>
  <desc id="desc">The LAMMPS manual distilled into a reusable skill that Claude uses for molecular dynamics simulation guidance.</desc>

  <defs>
    <filter id="sh" x="-6%" y="-4%" width="112%" height="118%">
      <feDropShadow dx="1" dy="5" stdDeviation="11" flood-color="#1B252D" flood-opacity="0.06"/>
    </filter>
    <filter id="shDeep" x="-6%" y="-4%" width="112%" height="120%">
      <feDropShadow dx="2" dy="7" stdDeviation="16" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <radialGradient id="fe" cx="30%" cy="26%" r="74%">
      <stop offset="0" stop-color="#F08050"/>
      <stop offset="1" stop-color="#B23A0B"/>
    </radialGradient>
    <radialGradient id="ox" cx="30%" cy="26%" r="74%">
      <stop offset="0" stop-color="#8CB8FF"/>
      <stop offset="0.55" stop-color="#3474E8"/>
      <stop offset="1" stop-color="#1A429E"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1440" height="510" fill="#F7F6F2"/>

  <!-- ═══════════════ HEADER ═══════════════ -->
  <text x="82" y="54" fill="#A95C45"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="11" font-weight="700" letter-spacing="2.2">LAMMPS × CLAUDE</text>
  <text x="82" y="100" fill="#1B252D"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="36" font-weight="700" letter-spacing="-0.8">From manual to practical simulation help</text>
  <text x="84" y="130" fill="#68737C"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="15">A focused LAMMPS skill for Claude.</text>

  <!-- ═══════════════ CARD 1 — LAMMPS ═══════════════ -->
  <rect x="80" y="168" width="398" height="262" rx="12" fill="#080A10" filter="url(#shDeep)"/>

  <!-- hexagonal crystal lattice — Fe₂O₃ inspired -->
  <!-- bonds between rows 2-3 -->
  <g stroke="#3A4860" stroke-width="1.4" stroke-opacity="0.22">
    <line x1="131" y1="235" x2="110" y2="268"/><line x1="131" y1="235" x2="152" y2="268"/>
    <line x1="173" y1="235" x2="152" y2="268"/><line x1="173" y1="235" x2="194" y2="268"/>
    <line x1="215" y1="235" x2="194" y2="268"/><line x1="215" y1="235" x2="236" y2="268"/>
    <line x1="257" y1="235" x2="236" y2="268"/><line x1="257" y1="235" x2="278" y2="268"/>
    <line x1="299" y1="235" x2="278" y2="268"/><line x1="299" y1="235" x2="320" y2="268"/>
    <line x1="341" y1="235" x2="320" y2="268"/><line x1="341" y1="235" x2="362" y2="268"/>
    <line x1="383" y1="235" x2="362" y2="268"/><line x1="383" y1="235" x2="404" y2="268"/>
    <line x1="425" y1="235" x2="404" y2="268"/><line x1="425" y1="235" x2="446" y2="268"/>
  </g>
  <!-- row 1 — Fe (y=202) -->
  <circle cx="110" cy="202" r="13" fill="url(#fe)"/>
  <circle cx="152" cy="202" r="13" fill="url(#fe)"/>
  <circle cx="194" cy="202" r="13" fill="url(#fe)"/>
  <circle cx="236" cy="202" r="13" fill="url(#fe)"/>
  <circle cx="278" cy="202" r="13" fill="url(#fe)"/>
  <circle cx="320" cy="202" r="13" fill="url(#fe)"/>
  <circle cx="362" cy="202" r="13" fill="url(#fe)"/>
  <circle cx="404" cy="202" r="13" fill="url(#fe)"/>
  <circle cx="446" cy="202" r="13" fill="url(#fe)"/>
  <!-- row 2 — O (y=235, offset 21px) -->
  <circle cx="131" cy="235" r="11" fill="url(#ox)"/>
  <circle cx="173" cy="235" r="11" fill="url(#ox)"/>
  <circle cx="215" cy="235" r="11" fill="url(#ox)"/>
  <circle cx="257" cy="235" r="11" fill="url(#ox)"/>
  <circle cx="299" cy="235" r="11" fill="url(#ox)"/>
  <circle cx="341" cy="235" r="11" fill="url(#ox)"/>
  <circle cx="383" cy="235" r="11" fill="url(#ox)"/>
  <circle cx="425" cy="235" r="11" fill="url(#ox)"/>
  <!-- row 3 — Fe (y=268) -->
  <circle cx="110" cy="268" r="13" fill="url(#fe)"/>
  <circle cx="152" cy="268" r="13" fill="url(#fe)"/>
  <circle cx="194" cy="268" r="13" fill="url(#fe)"/>
  <circle cx="236" cy="268" r="13" fill="url(#fe)"/>
  <circle cx="278" cy="268" r="13" fill="url(#fe)"/>
  <circle cx="320" cy="268" r="13" fill="url(#fe)"/>
  <circle cx="362" cy="268" r="13" fill="url(#fe)"/>
  <circle cx="404" cy="268" r="13" fill="url(#fe)"/>
  <circle cx="446" cy="268" r="13" fill="url(#fe)"/>
  <!-- row 4 — O (y=301) -->
  <circle cx="131" cy="301" r="11" fill="url(#ox)"/>
  <circle cx="173" cy="301" r="11" fill="url(#ox)"/>
  <circle cx="215" cy="301" r="11" fill="url(#ox)"/>
  <circle cx="257" cy="301" r="11" fill="url(#ox)"/>
  <circle cx="299" cy="301" r="11" fill="url(#ox)"/>
  <circle cx="341" cy="301" r="11" fill="url(#ox)"/>
  <circle cx="383" cy="301" r="11" fill="url(#ox)"/>
  <circle cx="425" cy="301" r="11" fill="url(#ox)"/>

  <!-- LAMMPS label -->
  <text x="110" y="356" fill="#FFFFFF"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="28" font-weight="700" letter-spacing="0.3">LAMMPS</text>
  <text x="112" y="382" fill="#6B7685"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="12">Documentation · 900+ pages</text>
  <text x="112" y="410" fill="#464F5B"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="10" font-weight="600" letter-spacing="1.2">MANUAL</text>

  <!-- ═══════════════ CONNECTOR 1 → 2 ═══════════════ -->
  <line x1="492" y1="299" x2="536" y2="299" stroke="#B4BCC4" stroke-width="1.2"/>
  <path d="M531 294 l7 5 -7 5" fill="none" stroke="#89949D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ═══════════════ CARD 2 — SKILL ═══════════════ -->
  <rect x="548" y="168" width="330" height="262" rx="12" fill="#FFFFFF" stroke="#E3DCD5" stroke-width="1.3" filter="url(#sh)"/>
  <!-- orange accent bar -->
  <rect x="548" y="168" width="330" height="3.5" fill="#D96B4B"/>

  <!-- label -->
  <text x="580" y="207" fill="#A95C45"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="10" font-weight="700" letter-spacing="1.4">REUSABLE KNOWLEDGE</text>

  <!-- document icon -->
  <g transform="translate(580, 222)">
    <rect x="0" y="0" width="48" height="60" rx="4" fill="#FFF8F4" stroke="#D4A08E" stroke-width="1.2"/>
    <path d="M34 0 v8 a3 3 0 0 0 3 3 h8" fill="none" stroke="#D4A08E" stroke-width="1.2"/>
    <path d="M34 0 l14 11" fill="none" stroke="#D4A08E" stroke-width="1.2"/>
    <!-- yaml frontmatter accent -->
    <rect x="7" y="8" width="22" height="3" rx="1" fill="#D96B4B"/>
    <rect x="7" y="14" width="16" height="3" rx="1" fill="#D96B4B" opacity="0.45"/>
    <!-- content lines -->
    <line x1="7" y1="25" x2="38" y2="25" stroke="#C8BFB5" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="7" y1="32" x2="32" y2="32" stroke="#C8BFB5" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="7" y1="39" x2="36" y2="39" stroke="#C8BFB5" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="7" y1="46" x2="28" y2="46" stroke="#C8BFB5" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="7" y1="53" x2="34" y2="53" stroke="#C8BFB5" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- title and description next to icon -->
  <text x="640" y="253" fill="#1F2D39"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="20" font-weight="700">LAMMPS skill</text>
  <text x="640" y="275" fill="#68737C"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="13">SKILL.md · 21 sections</text>

  <!-- separator -->
  <line x1="580" y1="302" x2="856" y2="302" stroke="#ECE9E5" stroke-width="1"/>

  <!-- content topics -->
  <text x="580" y="332" fill="#35424D"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="13.5" font-weight="600">Commands · force fields · workflows</text>
  <text x="580" y="358" fill="#828C95"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="12">Pair styles, fixes, recipes, accelerators</text>
  <text x="580" y="400" fill="#9CA5AE"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="11">Curated from the LAMMPS manual</text>

  <!-- ═══════════════ CONNECTOR 2 → 3 ═══════════════ -->
  <line x1="892" y1="299" x2="936" y2="299" stroke="#B4BCC4" stroke-width="1.2"/>
  <path d="M931 294 l7 5 -7 5" fill="none" stroke="#89949D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ═══════════════ CARD 3 — CLAUDE ═══════════════ -->
  <rect x="948" y="168" width="398" height="262" rx="12" fill="#FFFDFB" stroke="#E6E2DE" stroke-width="1.2" filter="url(#sh)"/>

  <!-- Claude asterisk mark — 8 short spokes -->
  <g transform="translate(993, 220)" stroke="#D97757" stroke-width="5" stroke-linecap="round">
    <line x1="0" y1="-23" x2="0" y2="-10"/>
    <line x1="16.3" y1="-16.3" x2="7.1" y2="-7.1"/>
    <line x1="23" y1="0" x2="10" y2="0"/>
    <line x1="16.3" y1="16.3" x2="7.1" y2="7.1"/>
    <line x1="0" y1="23" x2="0" y2="10"/>
    <line x1="-16.3" y1="16.3" x2="-7.1" y2="7.1"/>
    <line x1="-23" y1="0" x2="-10" y2="0"/>
    <line x1="-16.3" y1="-16.3" x2="-7.1" y2="-7.1"/>
  </g>
  <!-- "Claude" in serif -->
  <text x="1028" y="228" fill="#1C1B19"
        font-family="Georgia,'Times New Roman',serif"
        font-size="27">Claude</text>

  <!-- inner prompt card -->
  <rect x="972" y="254" width="350" height="148" rx="10" fill="#FAF9F6" stroke="#E6E2DE" stroke-width="1"/>

  <!-- user prompt -->
  <text x="992" y="282" fill="#82878D"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="12.5" font-style="italic">Set up NPT equilibration at 300 K</text>

  <!-- separator inside prompt card -->
  <line x1="992" y1="296" x2="1298" y2="296" stroke="#ECE9E5" stroke-width="1"/>

  <!-- code response block -->
  <rect x="984" y="308" width="326" height="56" rx="6" fill="#F3F1ED"/>
  <text x="998" y="330" fill="#35424D"
        font-family="'SFMono-Regular',Menlo,Monaco,monospace"
        font-size="11.5">fix 1 all npt temp 300 300 100 \</text>
  <text x="998" y="349" fill="#35424D"
        font-family="'SFMono-Regular',Menlo,Monaco,monospace"
        font-size="11.5">    iso 1.0 1.0 1000</text>

  <!-- bottom label inside prompt -->
  <text x="992" y="388" fill="#828C95"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="11">Grounded in LAMMPS documentation</text>

  <!-- action labels below card -->
  <text x="948" y="446" fill="#35424D"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="13" font-weight="600">Explain · debug · guide</text>

  <!-- ═══════════════ BOTTOM FLOW ═══════════════ -->
  <line x1="82" y1="474" x2="480" y2="474" stroke="#E6E2DE" stroke-width="1"/>
  <text x="82" y="496" fill="#8A949D"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="11" font-weight="600" letter-spacing="0.8">LAMMPS MANUAL  →  SKILL  →  CLAUDE</text>
</svg>
